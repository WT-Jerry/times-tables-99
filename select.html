<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>關卡選擇 · 趣味九九乘法表</title>
  <script>
    (function () {
      var n = (location.hash || "").replace(/^#/, "");
      if (!/^[1-9]$/.test(n) && n !== "mix") {
        var q = new URLSearchParams(location.search).get("n") || "";
        if (/^[1-9]$/.test(q) || q === "mix") n = q;
      }
      var dest = "index.html?view=select";
      if (/^[1-9]$/.test(n) || n === "mix") dest += "&n=" + encodeURIComponent(n);
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p><a href="index.html?view=select">前往關卡選擇</a></p>
</body>
</html>
