<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3c7faa">
  <title>趣味九九乘法表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="home">
    <div class="sparkles" aria-hidden="true"></div>

    <svg class="scene" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- rolling hills like the reference wallpaper -->
      <path d="M-40 430 C 40 390, 120 430, 200 380 C 280 335, 340 400, 430 360 L 430 860 L -40 860 Z" fill="#6db298"/>
      <path d="M-40 500 C 60 455, 150 510, 250 460 C 330 420, 390 490, 450 455 L 450 860 L -40 860 Z" fill="#59969d"/>
      <path d="M-40 560 C 80 520, 170 590, 280 540 C 350 510, 410 575, 470 540 L 470 860 L -40 860 Z" fill="#4e9336"/>
      <path d="M-20 620 C 90 580, 190 650, 300 600 C 370 570, 430 640, 480 610 L 480 860 L -20 860 Z" fill="#5aa43c"/>
      <path d="M120 720 C 220 680, 300 760, 430 700 L 430 860 L 80 860 Z" fill="#2c6042" opacity="0.55"/>

      <!-- left tree -->
      <rect x="48" y="248" width="46" height="250" rx="23" fill="#4685b8" stroke="#1e3f66" stroke-width="4"/>
      <ellipse cx="71" cy="355" rx="15" ry="42" fill="#154269"/>
      <circle cx="70" cy="168" r="90" fill="#538e3c" stroke="#1e530f" stroke-width="4"/>
      <circle cx="22" cy="188" r="58" fill="#86c962" stroke="#1e530f" stroke-width="3.5"/>
      <circle cx="118" cy="182" r="54" fill="#4a8334" stroke="#1e530f" stroke-width="3.5"/>
      <circle cx="58" cy="142" r="44" fill="#f6e9c9" stroke="#d4c39a" stroke-width="2"/>
      <circle cx="44" cy="132" r="6.5" fill="#e58aa4"/>
      <circle cx="68" cy="126" r="6.5" fill="#e58aa4"/>
      <circle cx="56" cy="152" r="6.5" fill="#e58aa4"/>
      <circle cx="76" cy="146" r="6.5" fill="#e58aa4"/>

      <!-- right tree -->
      <rect x="308" y="230" width="50" height="260" rx="25" fill="#4685b8" stroke="#1e3f66" stroke-width="4"/>
      <ellipse cx="333" cy="345" rx="16" ry="46" fill="#154269"/>
      <circle cx="334" cy="150" r="96" fill="#538e3c" stroke="#1e530f" stroke-width="4"/>
      <circle cx="286" cy="168" r="60" fill="#86c962" stroke="#1e530f" stroke-width="3.5"/>
      <circle cx="382" cy="164" r="56" fill="#4a8334" stroke="#1e530f" stroke-width="3.5"/>
      <circle cx="328" cy="122" r="48" fill="#f6e9c9" stroke="#d4c39a" stroke-width="2"/>
      <circle cx="312" cy="112" r="7" fill="#e58aa4"/>
      <circle cx="338" cy="106" r="7" fill="#e58aa4"/>
      <circle cx="324" cy="134" r="7" fill="#e58aa4"/>
      <circle cx="348" cy="126" r="7" fill="#e58aa4"/>

      <!-- small mid tree -->
      <rect x="178" y="318" width="28" height="130" rx="14" fill="#4685b8" stroke="#1e3f66" stroke-width="3.5"/>
      <ellipse cx="192" cy="372" rx="9" ry="26" fill="#154269"/>
      <circle cx="192" cy="292" r="48" fill="#538e3c" stroke="#1e530f" stroke-width="3.5"/>
      <circle cx="168" cy="300" r="30" fill="#86c962" stroke="#1e530f" stroke-width="3"/>
      <circle cx="216" cy="298" r="28" fill="#4a8334" stroke="#1e530f" stroke-width="3"/>
      <circle cx="190" cy="278" r="24" fill="#f6e9c9" stroke="#d4c39a" stroke-width="2"/>
      <circle cx="180" cy="272" r="4.5" fill="#e58aa4"/>
      <circle cx="196" cy="268" r="4.5" fill="#e58aa4"/>
      <circle cx="188" cy="284" r="4.5" fill="#e58aa4"/>

      <!-- bunting between big trees -->
      <path d="M118 210 C 170 250, 230 200, 286 218" fill="none" stroke="#2a4a6a" stroke-width="3"/>
      <polygon points="140,226 156,222 150,250" fill="#5aa8d8"/>
      <polygon points="168,234 184,228 180,256" fill="#f5b041"/>
      <polygon points="196,224 214,230 202,258" fill="#7dcc6a"/>
      <polygon points="222,226 240,220 236,250" fill="#f48fb1"/>
      <polygon points="250,224 268,218 264,248" fill="#f7e07a"/>
      <polygon points="272,222 286,226 276,250" fill="#7eb6ea"/>

      <!-- grass marks -->
      <path d="M48 690 l 8 14 l 8 -14" fill="none" stroke="#2f5325" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M110 740 l 8 14 l 8 -14" fill="none" stroke="#2f5325" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M200 780 l 8 14 l 8 -14" fill="none" stroke="#2f5325" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M280 730 l 8 14 l 8 -14" fill="none" stroke="#2f5325" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M340 680 l 8 14 l 8 -14" fill="none" stroke="#2f5325" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <header class="chrome">
      <button class="icon-btn" id="btn-settings" type="button" aria-label="設定">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.39-1.04-.7-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64L4.86 10.7c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
        </svg>
      </button>
      <button class="parent-btn" id="btn-parents" type="button">父母須知</button>
    </header>

    <div class="hero">
      <h1 class="title">趣味九九乘法表</h1>
    </div>

    <div class="cast" aria-hidden="true">
      <img class="mascot cinna" src="assets/cinna.png" alt="">
      <img class="mascot pompom" src="assets/pompom.png" alt="">
    </div>

    <div class="play-wrap">
      <button class="play" id="play-btn" type="button">玩</button>
    </div>
  </main>

  <audio id="bgm" src="assets/bgm.mp3" loop preload="auto" playsinline></audio>

  <div class="dialog" id="dlg-settings" role="dialog" aria-labelledby="settings-title" aria-modal="true">
    <div class="card">
      <h2 id="settings-title">設定</h2>
      <div class="toggle-row">
        <span>音效</span>
        <button class="switch" id="sound-switch" type="button" aria-pressed="true" aria-label="音效開關"><i></i></button>
      </div>
      <label for="kid-name">小朋友怎麼稱呼（選填）</label>
      <input id="kid-name" type="text" maxlength="8" placeholder="例如：小明" autocomplete="nickname">
      <div class="card-actions">
        <button class="close-card" id="btn-save-settings" type="button" data-close>好</button>
      </div>
    </div>
  </div>

  <div class="dialog" id="dlg-parents" role="dialog" aria-labelledby="parents-title" aria-modal="true">
    <div class="card">
      <h2 id="parents-title">父母須知</h2>
      <ul>
        <li>給小學二年級練習九九乘法，一次建議 10 分鐘。</li>
        <li>不會收集小朋友的個人資料，名字只存在這台手機。</li>
        <li>沒有廣告、沒有內購。</li>
        <li>鋼琴背景音樂會循環播放，可在左上角設定關掉。</li>
      </ul>
      <div class="card-actions">
        <button class="close-card" type="button" data-close>知道了</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
