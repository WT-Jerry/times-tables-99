<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8e8f6">
  <title>趣味九九乘法表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="home">
    <div class="sparkles" aria-hidden="true"></div>

    <svg class="scene" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- clouds -->
      <g fill="#fff" stroke="#e8d5c4" stroke-width="3">
        <ellipse cx="70" cy="92" rx="34" ry="16"/>
        <ellipse cx="98" cy="96" rx="22" ry="12"/>
        <ellipse cx="300" cy="80" rx="40" ry="18"/>
        <ellipse cx="332" cy="84" rx="24" ry="12"/>
      </g>

      <!-- far mint hills -->
      <path d="M-30 500 C 50 455, 130 490, 210 450 C 290 412, 350 470, 430 445 L 430 860 L -30 860 Z" fill="#d7f0c9" stroke="#c9a07a" stroke-width="3"/>
      <path d="M-40 560 C 70 520, 170 590, 270 530 C 340 492, 400 550, 470 525 L 470 860 L -40 860 Z" fill="#c8eab4" stroke="#c9a07a" stroke-width="3"/>

      <!-- left tree: cream trunk + round mint canopy -->
      <rect x="46" y="230" width="32" height="150" rx="16" fill="#f0e2c4" stroke="#c9a07a" stroke-width="3.5"/>
      <circle cx="62" cy="168" r="82" fill="#c9ebc0" stroke="#c9a07a" stroke-width="3.5"/>
      <circle cx="24" cy="160" r="54" fill="#d8f3d0" stroke="#c9a07a" stroke-width="3"/>
      <circle cx="100" cy="164" r="50" fill="#b7e0ae" stroke="#c9a07a" stroke-width="3"/>
      <circle cx="62" cy="118" r="42" fill="#e4f7dc" stroke="#c9a07a" stroke-width="3"/>
      <circle cx="30" cy="142" r="5" fill="#f7c5d8" stroke="#c9a07a" stroke-width="2"/>
      <circle cx="92" cy="134" r="5" fill="#f7c5d8" stroke="#c9a07a" stroke-width="2"/>
      <circle cx="62" cy="98" r="4.5" fill="#ffd6e7" stroke="#c9a07a" stroke-width="2"/>

      <!-- right tree -->
      <rect x="318" y="218" width="34" height="155" rx="17" fill="#f0e2c4" stroke="#c9a07a" stroke-width="3.5"/>
      <circle cx="336" cy="148" r="88" fill="#c9ebc0" stroke="#c9a07a" stroke-width="3.5"/>
      <circle cx="294" cy="140" r="56" fill="#d8f3d0" stroke="#c9a07a" stroke-width="3"/>
      <circle cx="376" cy="142" r="52" fill="#b7e0ae" stroke="#c9a07a" stroke-width="3"/>
      <circle cx="336" cy="96" r="46" fill="#e4f7dc" stroke="#c9a07a" stroke-width="3"/>
      <circle cx="304" cy="114" r="5" fill="#f7c5d8" stroke="#c9a07a" stroke-width="2"/>
      <circle cx="366" cy="110" r="5" fill="#ffd6e7" stroke="#c9a07a" stroke-width="2"/>
      <circle cx="338" cy="78" r="4.5" fill="#f7c5d8" stroke="#c9a07a" stroke-width="2"/>

      <!-- chubby mid trees -->
      <rect x="168" y="360" width="22" height="70" rx="11" fill="#f0e2c4" stroke="#c9a07a" stroke-width="3"/>
      <circle cx="179" cy="330" r="42" fill="#d8f3d0" stroke="#c9a07a" stroke-width="3"/>
      <circle cx="158" cy="324" r="26" fill="#e4f7dc" stroke="#c9a07a" stroke-width="2.5"/>
      <circle cx="200" cy="326" r="24" fill="#c9ebc0" stroke="#c9a07a" stroke-width="2.5"/>
      <circle cx="176" cy="312" r="4" fill="#f7c5d8" stroke="#c9a07a" stroke-width="1.8"/>

      <!-- tiny mid bushes -->
      <ellipse cx="78" cy="470" rx="52" ry="24" fill="#c3e6b6" stroke="#c9a07a" stroke-width="3"/>
      <ellipse cx="312" cy="462" rx="56" ry="26" fill="#c3e6b6" stroke="#c9a07a" stroke-width="3"/>

      <!-- pastel bunting -->
      <path d="M10 214 C 48 242, 86 198, 128 228" fill="none" stroke="#c9a07a" stroke-width="2.5"/>
      <polygon points="24,220 38,220 31,244" fill="#f7c5d8" stroke="#c9a07a" stroke-width="2"/>
      <polygon points="48,228 62,222 58,248" fill="#ffe3a3" stroke="#c9a07a" stroke-width="2"/>
      <polygon points="72,218 88,224 78,248" fill="#c9ebc0" stroke="#c9a07a" stroke-width="2"/>
      <polygon points="98,224 114,218 110,246" fill="#cde8fb" stroke="#c9a07a" stroke-width="2"/>

      <path d="M258 178 C 304 210, 344 168, 398 198" fill="none" stroke="#c9a07a" stroke-width="2.5"/>
      <polygon points="274,186 290,182 284,208" fill="#ffe3a3" stroke="#c9a07a" stroke-width="2"/>
      <polygon points="304,186 320,178 318,206" fill="#f7c5d8" stroke="#c9a07a" stroke-width="2"/>
      <polygon points="332,178 348,184 338,208" fill="#cde8fb" stroke="#c9a07a" stroke-width="2"/>
      <polygon points="358,182 376,174 372,204" fill="#c9ebc0" stroke="#c9a07a" stroke-width="2"/>

      <!-- grass tufts -->
      <path d="M36 700 q 8 -16 14 0" fill="none" stroke="#9cc48a" stroke-width="3" stroke-linecap="round"/>
      <path d="M86 748 q 9 -18 16 0" fill="none" stroke="#9cc48a" stroke-width="3" stroke-linecap="round"/>
      <path d="M168 790 q 8 -14 14 0" fill="none" stroke="#9cc48a" stroke-width="3" stroke-linecap="round"/>
      <path d="M250 770 q 9 -16 15 0" fill="none" stroke="#9cc48a" stroke-width="3" stroke-linecap="round"/>
      <path d="M330 720 q 8 -15 14 0" fill="none" stroke="#9cc48a" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <header class="chrome">
      <button class="icon-btn" id="btn-settings" type="button" aria-label="設定">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.39-1.04-.7-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64L4.86 10.7c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
        </svg>
      </button>
      <button class="parent-btn" id="btn-parents" type="button">父母須知</button>
    </header>

    <div class="hero">
      <h1 class="title">趣味九九乘法表</h1>
    </div>

    <div class="cast" aria-hidden="true">
      <img class="mascot cinna" src="assets/cinna.png" alt="">
      <img class="mascot pompom" src="assets/pompom.png" alt="">
    </div>

    <div class="play-wrap">
      <button class="play" id="play-btn" type="button">玩</button>
    </div>
  </main>

  <audio id="bgm" src="assets/bgm.mp3" loop preload="auto" playsinline></audio>

  <div class="dialog" id="dlg-settings" role="dialog" aria-labelledby="settings-title" aria-modal="true">
    <div class="card">
      <h2 id="settings-title">設定</h2>
      <div class="toggle-row">
        <span>音效</span>
        <button class="switch" id="sound-switch" type="button" aria-pressed="true" aria-label="音效開關"><i></i></button>
      </div>
      <label for="kid-name">小朋友怎麼稱呼（選填）</label>
      <input id="kid-name" type="text" maxlength="8" placeholder="例如：小明" autocomplete="nickname">
      <div class="card-actions">
        <button class="close-card" id="btn-save-settings" type="button" data-close>好</button>
      </div>
    </div>
  </div>

  <div class="dialog" id="dlg-parents" role="dialog" aria-labelledby="parents-title" aria-modal="true">
    <div class="card">
      <h2 id="parents-title">父母須知</h2>
      <ul>
        <li>給小學二年級練習九九乘法，一次建議 10 分鐘。</li>
        <li>不會收集小朋友的個人資料，名字只存在這台手機。</li>
        <li>沒有廣告、沒有內購。</li>
        <li>鋼琴背景音樂會循環播放，可在左上角設定關掉。</li>
      </ul>
      <div class="card-actions">
        <button class="close-card" type="button" data-close>知道了</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
